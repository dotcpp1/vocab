/* Compact flashcards: one word, one concise rendering per semantic sense. */
.ledger-section{background:transparent;border:0;border-radius:0;overflow:visible;margin-bottom:26px}
.ledger-head{border:1px solid var(--line);border-radius:11px;padding:13px 17px;margin-bottom:12px;background:var(--soft)}
.card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.vocab-card.ledger-row{display:flex;flex-direction:column;align-items:stretch;gap:0;min-width:0;min-height:206px;padding:20px 18px 17px;border:1px solid #d8e1dc;border-radius:15px;background:var(--paper);scroll-margin-top:115px;transition:border-color .15s}
.vocab-card.ledger-row:last-child{border-bottom:1px solid #d8e1dc}
.vocab-card:hover{border-color:#b6c9be}
.vocab-card.is-known{border-color:#a1beb1}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;min-height:33px}
.card-top .wordcell{display:flex;align-items:center;flex-wrap:wrap;gap:7px;min-width:0}
.vocab-card .wordbutton{font-family:inherit;font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.025em;overflow-wrap:anywhere;color:var(--wc)}
.card-number{font-size:11px;color:#95a09c;margin-top:6px;flex:none}
.vocab-card .badges{display:inline-flex;gap:4px;margin:0}
.vocab-card .badge{font-size:10px;border-radius:5px;padding:2px 4px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 17px;color:#687972}
.card-tags>span{font-size:11px;background:#f0f4f1;padding:4px 8px;border-radius:999px;line-height:1.3}
.answer-wrap{position:relative;flex:1;display:flex;align-items:flex-start;min-height:34px;margin:0 0 19px}
.vocab-card .meaningcell{width:100%;font-size:16px;line-height:1.8;color:var(--wc);font-weight:650;overflow-wrap:break-word}
.vocab-card .sense{font-size:16px;line-height:1.9;font-weight:650;padding:0 1px;color:inherit;display:inline;text-align:left;max-width:100%;vertical-align:baseline}
.vocab-card .sense.current{font-weight:750}
.vocab-card .sense:hover{background:#eef4ef}
.vocab-card .delimiter{font-size:13px;font-weight:400;color:#aeb9b3;padding:0 4px}
.origin{font-size:9px;display:inline-block;line-height:1.4;padding:1px 3px;border-radius:3px;background:#f9f3e8;color:#887250;margin-left:4px;vertical-align:middle}
.card-actions{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;margin-top:auto}
.card-jump,.vocab-card .know{width:auto;height:auto;min-width:0;min-height:35px;padding:7px 9px;background:white;border:1px solid #cfdcd4;border-radius:8px;font-size:12px;line-height:1.4;white-space:normal;color:#344d42}
.vocab-card .know.done{background:var(--accent);color:#fff;border-color:var(--accent)}
.card-jump:hover,.vocab-card .know:not(.done):hover{background:#f2f6f2}
.reveal-prompt{display:none;position:absolute;inset:0 auto auto 0;min-height:33px;border:1px dashed #b9cabe;padding:5px 10px;border-radius:7px;background:#f7f9f6;color:#73867a;font-size:13px}
.hidden-senses .vocab-card:not(.revealed) .reveal-prompt{display:block}
.hidden-senses .vocab-card:not(.revealed) .meaningcell{visibility:hidden;pointer-events:none}
.hidden-senses .vocab-card.revealed .meaningcell{visibility:visible}
.usage-note{font-size:13px;margin-top:15px;color:var(--muted)}
.usage-note summary{cursor:pointer;padding:3px 0}
.sense-detail .origin{font-size:10px}

.word-token,.zh-atom{display:inline;border-radius:2px}

/* Optional contexts are not separate study items. */
.core-examples{display:grid;gap:6px;margin:8px 0}.core-example{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fafcfb;text-align:left;font-size:13px;line-height:1.7}.core-example:hover{background:var(--soft)}.core-example small{display:block;color:var(--muted);font-size:11px}

/* Unfamiliar-word marker: background only; original font color stays unchanged. */
:root{--unfamiliar-bg:#FFF0B3;--unfamiliar-border:#D7BF6B}
.unfamiliar-fill{background-color:var(--unfamiliar-bg)!important;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.word-token.unfamiliar-fill .target{background-color:transparent}
.card-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.unfamiliar-toggle.active{background:var(--unfamiliar-bg);border-color:var(--unfamiliar-border)}

.word-mark-actions .context{margin:0}

.unfamiliar-list-word{font-family:Georgia,"Times New Roman",serif;font-size:22px;overflow-wrap:anywhere}
.unfamiliar-list-row .actions{flex:none;margin:0}
.unfamiliar-help{font-size:12px;line-height:1.8;color:var(--muted);margin-top:12px}

<header class="wrap"><div class="hero"><div class="kicker">考研英语真题词汇 · 剧情串联记忆版</div><h1><span>2014</span> · 阅读核心卡片</h1><p class="sub">先记阅读核心；不熟时回剧情。已收录的旧词不重复建卡，单词划线只对应当前用法。</p><div class="counts" id="counts"></div></div></header>

<script>
'use strict';
const DATA=JSON.parse(document.getElementById('app-data').textContent);
const $=id=>document.getElementById(id);
const E=new Map(DATA.entries.map(e=>[e.id,e])),W=new Map(DATA.words.map(w=>[w.key,w])),M=new Map(DATA.modules.map(m=>[m.id,m])),O=new Map(DATA.occurrences.map(o=>[o.id,o]));
const S=new Map(),G=new Map(),L=new Map(),SENSE=new Map();
// Keep original senses for source tracing; use explicit reading-core groups for study.
const CONCEPT=new Map();
DATA.words.forEach(w=>{
 w.senses.forEach(s=>SENSE.set(s.id,{...s,key:w.key}));
 for(const c of w.readingConcepts){
  const members=c.senseIds.map(id=>SENSE.get(id));
  const preferred=members.find(s=>s.id===c.preferredSenseId)||members[0];
  const ordered=[preferred,...members.filter(s=>s!==preferred)];
  const locations=[...new Set(ordered.flatMap(s=>s.locations))];
  const sources=[...new Set(members.map(s=>s.source))];
  const core={id:c.id,key:w.key,label:c.label,memberIds:[...c.senseIds],locations,
   preferredSenseId:preferred.id,source:sources.every(s=>s==='词义校核')?'词义校核':sources.every(s=>s==='考研常见补充义')?'考研常见补充义':'阅读核心概括',
   hasSupplement:sources.includes('考研常见补充义'),aliases:[...new Set(members.flatMap(s=>[s.label,...(s.aliases||[])]))]};
  CONCEPT.set(core.id,core);SENSE.set(core.id,core);
 }
});
function studySenses(w,e){
 return w.readingConcepts.map(c=>{
  const g=CONCEPT.get(c.id);return {...g,current:!!e&&g.memberIds.includes(e.mainSense)};
 });
}
function anchorForSense(s,e){
 if(e&&(s.id===e.mainSense||(s.memberIds||[]).includes(e.mainSense)))return e.mainTarget;
 // Prefer the example chosen for the core concept, rather than an arbitrary first sub-meaning.
 const preferred=s.preferredSenseId&&SENSE.get(s.preferredSenseId);
 if(preferred?.locations?.length)return preferred.locations[0];
 return (e&&s.locations.find(id=>O.get(id)?.text===e.text))||s.locations[0];
}
const MODULE_LABELS=new Map();
for(let t=1;t<=4;t++){let main=0,extra=0;for(const m of DATA.modules.filter(m=>m.text===t))MODULE_LABELS.set(m.id,m.kind==='main'?'剧情 '+(++main):'后续情节 '+(++extra));}

DATA.modules.forEach(m=>m.sentences.forEach(s=>{S.set(s.id,{...s,module:m.id});s.units.forEach(g=>{G.set(g.id,{...g,module:m.id,sentence:s.id});L.set(g.id,{id:g.id,en:g.en,zh:g.zh,module:m.id,type:'group',children:g.enTargets.map(t=>t.pair)});g.enTargets.forEach(t=>L.set(t.pair,{id:t.pair,en:t.text,zh:t.zh,module:m.id,type:'target',group:g.id,primary:t.primary,key:t.key}));});}));
// Every English occurrence has its own ID and explicit Chinese character ranges.
// No selection ever falls back to its sentence or legacy semantic-group container.
const WORD=new Map(DATA.wordAlignment.map(w=>[w.id,w]));
const ZINFO=new Map();
for(const [gid,g] of G){
 for(let i=0;i<g.zh.length;i++){
  const id=gid+'_c'+i;
  const item={id,g:gid,a:i,b:i+1,text:g.zh[i],module:g.module};
  ZINFO.set(id,item);L.set(id,{id,en:'',zh:item.text,module:g.module,type:'zh'});
 }
}
for(const w of WORD.values())L.set(w.id,{id:w.id,en:w.text,zh:w.z.map(z=>G.get(z.g).zh.slice(z.a,z.b)).join(''),module:G.get(w.g).module,type:'word',group:w.g});
const UNFAMILIAR_INDEX=new Map(),TOKEN_UNFAMILIAR_REF=new Map(),TOKEN_VOCAB_REFS=new Map();
for(const w of W.values())UNFAMILIAR_INDEX.set('v:'+w.key,{ref:'v:'+w.key,key:w.key,label:w.word,color:w.color,ids:[],jump:E.get(w.entryIds[0]).mainTarget});
for(const token of WORD.values()){
 const g=G.get(token.g),targets=g.enTargets.filter(t=>t.start<token.b&&t.end>token.a);
 const exactTarget=targets.find(t=>t.start===token.a&&t.end===token.b);
 const tokenNorm=String(token.text).toLowerCase().replace(/[^a-z0-9]/g,'');
 const key=exactTarget?exactTarget.key:(W.has(tokenNorm)?tokenNorm:null);
 const ref=key?'v:'+key:'t:'+token.text.toLowerCase();
 TOKEN_UNFAMILIAR_REF.set(token.id,ref);
 const refs=new Set(targets.map(t=>'v:'+t.key));if(key)refs.add(ref);TOKEN_VOCAB_REFS.set(token.id,refs);
 if(!UNFAMILIAR_INDEX.has(ref))UNFAMILIAR_INDEX.set(ref,{ref,key:null,label:token.text,color:null,ids:[],jump:token.id});
 for(const itemRef of new Set([ref,...refs])){const item=UNFAMILIAR_INDEX.get(itemRef);if(item&&!item.ids.includes(token.id))item.ids.push(token.id);}
}
const PREVIOUS_KEY='exam-vocab-2014-reading-core-word-v1';
const KEY='exam-vocab-2014-reading-core-word-unfamiliar-v1';
const CARD_KEYS=new Set(DATA.cardKeys);
const YEAR=DATA.meta.year;
let storageOK=true,stored={},migratedProgress=false,migrationNotice='';
try{
 let raw=localStorage.getItem(KEY);
 if(!raw){raw=localStorage.getItem(PREVIOUS_KEY);if(raw){migratedProgress=true;migrationNotice='已读取同一浏览器中的2014旧版记录；不熟底色另存，不覆盖旧版。';}}
 if(raw)stored=JSON.parse(raw);else stored={};
}catch(e){storageOK=false;stored={};}
const state={known:new Set(Array.isArray(stored.known)?stored.known:[]),modules:new Set(Array.isArray(stored.modules)?stored.modules:[]),marks:new Set(Array.isArray(stored.marks)?stored.marks:[]),unfamiliar:new Set(Array.isArray(stored.unfamiliar)?stored.unfamiliar.filter(ref=>UNFAMILIAR_INDEX.has(ref)):[]),excluded:new Set(),bionic:stored.bionic!==false,overrides:Object.create(null)};
function validZRanges(zs){return Array.isArray(zs)&&zs.length<=1000&&zs.every(z=>z&&G.has(z.g)&&Number.isInteger(z.a)&&Number.isInteger(z.b)&&z.a>=0&&z.b>z.a&&z.b<=G.get(z.g).zh.length);}
for(const [id,zs] of Object.entries(stored.overrides||{}))if(WORD.has(id)&&validZRanges(zs))state.overrides[id]=zs;
for(const id of [...state.marks])if(!WORD.has(id)&&!ZINFO.has(id))state.marks.delete(id);
const REVERSE=new Map();
function zRanges(id){const w=WORD.get(id);return w?(state.overrides[id]||w.z):[];}
function zhIds(id){const ids=[];for(const z of zRanges(id))for(let i=z.a;i<z.b;i++)ids.push(z.g+'_c'+i);return [...new Set(ids)];}
function counterpartText(id){return zRanges(id).map(z=>G.get(z.g).zh.slice(z.a,z.b)).join(' … ');}
function rebuildReverse(){
 REVERSE.clear();
 for(const w of WORD.values()){
  for(const z of zhIds(w.id)){if(!REVERSE.has(z))REVERSE.set(z,[]);REVERSE.get(z).push(w.id);}
  L.get(w.id).zh=counterpartText(w.id);
 }
}
rebuildReverse();

const ui={view:'ledger',text:0,q:'',poly:false,rare:false,hidden:false,onlyEn:false,ledgerY:0,ledgerFilters:null,focusEntry:null};
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2600);}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:DATA.meta.alignmentVersion,unfamiliarVersion:1,unfamiliar:[...state.unfamiliar],known:[...state.known],modules:[...state.modules],marks:[...state.marks],excluded:[...state.excluded],bionic:state.bionic,overrides:state.overrides}));}catch(e){storageOK=false;toast('浏览器未允许本地保存，请用备份按钮保存记录。');}updateProgress();}
function bio(s){return String(s).split(/([A-Za-z]+)/g).map(w=>{if(!/^[A-Za-z]+$/.test(w))return esc(w);let n=w.length===1?1:Math.max(1,Math.min(w.length-1,Math.floor(w.length*.45)));return '<b class="bp">'+esc(w.slice(0,n))+'</b>'+esc(w.slice(n));}).join('');}
function sourceBadge(s){return s.source==='词义校核'?'<span class="origin">校核义</span>':s.source==='考研常见补充义'?'<span class="origin">补充义</span>':'';}
function senseButton(s,eid,current){return `<button class="sense ${current?'current':''}" data-sense="${s.id}" data-entry="${eid||''}" title="点击核心含义，回到对应剧情">${esc(s.label)}${sourceBadge(s)}</button>`;}
function wordBadges(w,e){return `<span class="badges">${(e?e.rare:w.rare)?'<span class="badge rare">[僻]</span>':''}${w.poly?'<span class="badge poly">多义</span>':''}${['selfpromotion','principle','row','joint','illiberal'].includes(w.key)?'<span class="badge">资料提示</span>':''}</span>`;}
function matches(e){const w=W.get(e.key);if(ui.text&&e.text!==ui.text||ui.poly&&!w.poly||ui.rare&&!e.rare)return false;if(!ui.q)return true;const q=ui.q.toLowerCase(),n=norm(q);return e.word.toLowerCase().includes(q)||(n.length>0&&e.key.includes(n))||e.meaning.includes(q)||w.readingConcepts.some(c=>c.label.includes(q))||w.senses.some(s=>s.label.includes(q)||(s.aliases||[]).some(a=>a.includes(q)));}

function unfamiliarButton(ref){
